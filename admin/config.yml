backend:
  name: git-gateway
  branch: main

# Fișierele media (imagini pentru articole)
media_folder: "img/blog"
public_folder: "/img/blog"

# Limba interfeței
locale: ro

collections:
  - name: "posts"
    label: "Articole Blog"
    label_singular: "Articol"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    preview_path: "/blog/{{slug}}/"
    editor:
      preview: false
    fields:
      - label: "Titlu articol"
        name: "title"
        widget: "string"
        hint: "Titlul complet al articolului (apare în pagină și în tab-ul browserului)"

      - label: "Meta description (max 160 caractere)"
        name: "description"
        widget: "string"
        hint: "Descriere pentru Google și rețele sociale. Scrie concis, cu keyword-ul principal."
        pattern: ['.{10,160}', "Minim 10, maxim 160 de caractere"]

      - label: "Data publicării"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        default: ""

      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Materiale", value: "Materiale" }
          - { label: "Aplicații (baie, bucătărie, terasă...)", value: "Aplicații" }
          - { label: "Ghiduri tehnice", value: "Ghiduri tehnice" }
          - { label: "Servicii (montaj, restaurare)", value: "Servicii" }
          - { label: "Prețuri și costuri", value: "Prețuri și costuri" }

      - label: "Titlu pentru Google (max 60 caractere, opțional)"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Titlul care apare în rezultatele Google. Maxim 60 de caractere; dacă îl lași gol se folosește titlul articolului."
        pattern: ['^.{0,60}$', "Maxim 60 de caractere"]

      - label: "Articole similare (3-4)"
        name: "related"
        widget: "relation"
        collection: "posts"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        max: 4

      - label: "Pagini de material de legat"
        name: "materials"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Marmură", value: "marmura" }
          - { label: "Granit", value: "granit" }
          - { label: "Travertin", value: "travertin" }
          - { label: "Andezit", value: "andezit" }
          - { label: "Ardezie", value: "ardezie" }

      - label: "Servicii de legat"
        name: "services"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Montaj", value: "montaj" }
          - { label: "Restaurare", value: "restaurare" }
          - { label: "Consultanță", value: "consultanta" }

      - label: "Imagine principală (opțional)"
        name: "image"
        widget: "image"
        required: false
        hint: "Imagine pentru Open Graph (rețele sociale). Opțional."
        media_library:
          config:
            multiple: false

      - label: "Conținut articol"
        name: "body"
        widget: "markdown"
        hint: "Scrie articolul în format Markdown. Folosește ## pentru titluri de secțiuni, ### pentru sub-titluri, **text** pentru bold."
        modes: ["rich_text", "raw"]
